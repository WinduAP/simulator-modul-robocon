<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulator 1 Pulse vs 2 Pulse (Quadrature X1, X2, X4)</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --card: #090d16;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --chA: #22c55e;
      --chB: #f59e0b;
      --pulse: #ec4899;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      margin: 0; padding: 20px;
      background: var(--bg); color: var(--text);
      display: flex; justify-content: center;
    }
    .container {
      max-width: 980px; width: 100%;
      background: var(--panel); border-radius: 12px;
      padding: 20px; border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h2 { margin-top: 0; font-size: 1.3rem; color: var(--accent); }
    .controls {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px; background: #0f172a; padding: 15px; border-radius: 8px;
      margin-bottom: 18px; align-items: end;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    select, input[type="range"], button {
      padding: 9px 12px; border-radius: 6px; border: 1px solid #475569;
      background: #1e293b; color: white; font-size: 0.9rem; font-weight: 600;
    }
    .btn-row { display: flex; gap: 8px; }
    button { cursor: pointer; flex: 1; transition: 0.15s; }
    button:hover { background: #334155; }
    button.btn-cw { border-color: #22c55e; color: #4ade80; }
    button.btn-ccw { border-color: #f59e0b; color: #fbbf24; }
    button.btn-reset { border-color: #ef4444; color: #f87171; }

    .dashboard {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      margin-bottom: 18px;
    }
    @media (max-width: 768px) { .dashboard { grid-template-columns: repeat(2, 1fr); } }
    .metric-card {
      background: var(--card); border: 1px solid #334155;
      border-radius: 8px; padding: 12px; text-align: center;
    }
    .metric-title { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; }
    .metric-value { font-size: 1.5rem; font-weight: bold; margin-top: 4px; color: var(--accent); }
    .metric-sub { font-size: 0.75rem; color: #64748b; margin-top: 2px; }

    .main-grid {
      display: grid; grid-template-columns: 270px 1fr; gap: 18px;
    }
    @media (max-width: 820px) { .main-grid { grid-template-columns: 1fr; } }
    .canvas-box {
      background: var(--card); border: 1px solid #334155;
      border-radius: 8px; padding: 12px; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
    }
    canvas { max-width: 100%; border-radius: 6px; }
    .info-box {
      margin-top: 15px; padding: 14px; background: #0f172a;
      border-left: 4px solid var(--accent); border-radius: 6px;
      font-size: 0.9rem; line-height: 1.5; color: #e2e8f0;
    }
    .warn-text { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>Simulator Perbandingan: 1 Pulse vs 2 Pulse (Quadrature X1, X2, X4)</h2>

  <div class="controls">
    <div class="control-group">
      <label for="modeSelect">1. Pilih Mode Pembacaan Kontroler:</label>
      <select id="modeSelect">
        <option value="1pulse">1 Pulse (Hanya Channel A - Tanpa Arah)</option>
        <option value="x1">2 Pulse Quadrature X1 (Rising Edge Ch A)</option>
        <option value="x2">2 Pulse Quadrature X2 (Rising & Falling Ch A)</option>
        <option value="x4" selected>2 Pulse Quadrature X4 (Semua Edge Ch A & B)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="speedSlider">2. Kecepatan & Arah Motor (<span id="rpmLabel">12</span> RPM):</label>
      <input type="range" id="speedSlider" min="-30" max="30" value="12">
    </div>

    <div class="control-group">
      <label>3. Uji Balik Arah Cepat & Reset Counter:</label>
      <div class="btn-row">
        <button class="btn-cw" id="btnCW">Putar CW (+)</button>
        <button class="btn-ccw" id="btnCCW">Putar CCW (-)</button>
        <button class="btn-reset" id="btnReset">Reset (0)</button>
      </div>
    </div>
  </div>

  <!-- Kartu Metrik Pembacaan Kontroler -->
  <div class="dashboard">
    <div class="metric-card">
      <div class="metric-title">Posisi Aktual Motor</div>
      <div class="metric-value" id="realPosVal">0.0°</div>
      <div class="metric-sub" id="realTurnSub">Putaran Fisik: 0.00x</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Counter di PLC / MCU</div>
      <div class="metric-value" id="counterVal" style="color:#22c55e;">0</div>
      <div class="metric-sub" id="cprSub">Resolusi: 32 Count/Rev</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Deteksi Arah Kontroler</div>
      <div class="metric-value" id="dirVal" style="font-size:1.15rem; margin-top:10px;">MAJU (CW)</div>
      <div class="metric-sub" id="phaseSub">Ch A mendahului Ch B</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Posisi Terbaca Kontroler</div>
      <div class="metric-value" id="measuredPosVal">0.0°</div>
      <div class="metric-sub" id="errorSub">Selisih (Error): 0.0°</div>
    </div>
  </div>

  <div class="main-grid">
    <!-- Visualisasi Motor & Sensor A/B -->
    <div class="canvas-box">
      <canvas id="motorCanvas" width="245" height="260"></canvas>
    </div>

    <!-- Grafik Gelombang A, B, dan Titik Hitung (Counting Edges) -->
    <div class="canvas-box">
      <canvas id="waveCanvas" width="640" height="260"></canvas>
    </div>
  </div>

  <div class="info-box" id="explanationBox"></div>
</div>

<script>
  const motorCanvas = document.getElementById('motorCanvas');
  const mCtx = motorCanvas.getContext('2d');
  const waveCanvas = document.getElementById('waveCanvas');
  const wCtx = waveCanvas.getContext('2d');

  const modeSelect = document.getElementById('modeSelect');
  const speedSlider = document.getElementById('speedSlider');
  const rpmLabel = document.getElementById('rpmLabel');
  const btnCW = document.getElementById('btnCW');
  const btnCCW = document.getElementById('btnCCW');
  const btnReset = document.getElementById('btnReset');

  const realPosVal = document.getElementById('realPosVal');
  const realTurnSub = document.getElementById('realTurnSub');
  const counterVal = document.getElementById('counterVal');
  const cprSub = document.getElementById('cprSub');
  const dirVal = document.getElementById('dirVal');
  const phaseSub = document.getElementById('phaseSub');
  const measuredPosVal = document.getElementById('measuredPosVal');
  const errorSub = document.getElementById('errorSub');
  const explanationBox = document.getElementById('explanationBox');

  const PPR = 8; // 8 celah fisik per putaran (360 derajat)
  let totalAngle = 0; // Sudut kumulatif sebenarnya
  let rpm = 12;
  let counter = 0;

  let prevA = 0;
  let prevB = 0;
  const waveHistory = [];
  const maxHistory = 280;

  function getAB(deg) {
    // Normalisasi sudut 0 - 360
    const norm = ((deg % 360) + 360) % 360;
    const rad = (norm * Math.PI) / 180;
    const chA = Math.sin(PPR * rad) >= 0 ? 1 : 0;
    const chB = Math.cos(PPR * rad) >= 0 ? 1 : 0;
    return { chA, chB };
  }

  // Inisialisasi state awal
  const initSig = getAB(totalAngle);
  prevA = initSig.chA;
  prevB = initSig.chB;

  speedSlider.addEventListener('input', (e) => {
    rpm = parseFloat(e.target.value);
    rpmLabel.textContent = rpm;
  });

  btnCW.addEventListener('click', () => {
    rpm = 15;
    speedSlider.value = 15;
    rpmLabel.textContent = 15;
  });

  btnCCW.addEventListener('click', () => {
    rpm = -15;
    speedSlider.value = -15;
    rpmLabel.textContent = -15;
  });

  btnReset.addEventListener('click', () => {
    totalAngle = 0;
    counter = 0;
    waveHistory.length = 0;
    const s = getAB(0);
    prevA = s.chA;
    prevB = s.chB;
  });

  modeSelect.addEventListener('change', () => {
    // Sinkronkan ulang counter saat ganti mode agar adil
    totalAngle = 0;
    counter = 0;
    waveHistory.length = 0;
    updateExplanation();
  });

  function updateExplanation() {
    const mode = modeSelect.value;
    if (mode === '1pulse') {
      cprSub.textContent = `Resolusi: ${PPR} Count/Putaran`;
      explanationBox.innerHTML = `
        <strong>Mode 1 Pulse (Hanya Channel A):</strong> Kontroler hanya menerima 1 kabel sinyal dan menghitung setiap <em>Rising Edge</em> Channel A. 
        <span class="warn-text">Coba klik tombol "Putar CCW (-)"!</span> Anda akan melihat bahwa meskipun motor berputar mundur, nilai Counter di PLC justru <strong>terus bertambah (+)</strong> karena kontroler buta terhadap arah putaran. Akibatnya, posisi yang terbaca kontroler melenceng jauh dari posisi motor sebenarnya.
      `;
    } else if (mode === 'x1') {
      cprSub.textContent = `Resolusi: ${PPR} Count/Putaran (1x PPR)`;
      explanationBox.innerHTML = `
        <strong>Mode 2 Pulse — Quadrature X1:</strong> Kontroler mendeteksi titik <em>Rising Edge</em> pada Channel A dan mengecek logika Channel B pada detik itu. Saat berputar CW (A mendahului B), counter bertambah <strong>+1</strong>. Saat berputar CCW (B mendahului A), counter berkurang <strong>-1</strong>. Resolusi = 1x PPR (${PPR} titik per putaran, atau 45° per titik).
      `;
    } else if (mode === 'x2') {
      cprSub.textContent = `Resolusi: ${PPR * 2} Count/Putaran (2x PPR)`;
      explanationBox.innerHTML = `
        <strong>Mode 2 Pulse — Quadrature X2:</strong> Kontroler menghitung setiap kali Channel A mengalami transisi naik (<em>Rising Edge</em>) <strong>maupun</strong> turun (<em>Falling Edge</em>). Dengan piringan fisik yang sama (${PPR} PPR), resolusi pembacaan posisi meningkat 2 kali lipat menjadi <strong>${PPR * 2} titik per putaran</strong> (22.5° per titik).
      `;
    } else {
      cprSub.textContent = `Resolusi: ${PPR * 4} Count/Putaran (4x PPR)`;
      explanationBox.innerHTML = `
        <strong>Mode 2 Pulse — Quadrature X4 (Standar Presisi Tinggi):</strong> Kontroler menghitung seluruh transisi naik dan turun pada <strong>Channel A sekaligus Channel B</strong>. Lihat titik-titik merah muda yang rapat pada grafik! Resolusi meningkat 4 kali lipat menjadi <strong>${PPR * 4} titik per putaran</strong> (11.25° per titik) tanpa mengubah jumlah celah fisik encoder.
      `;
    }
  }

  function stepSimulation() {
    if (rpm !== 0) {
      const deltaDeg = (rpm * 360) / (60 * 60);
      totalAngle += deltaDeg;

      const { chA, chB } = getAB(totalAngle);
      const mode = modeSelect.value;
      let countEvent = 0; // 0: tidak ada, 1: tambah, -1: kurang

      if (mode === '1pulse') {
        // Hanya hitung Rising Edge A, selalu positif!
        if (prevA === 0 && chA === 1) {
          counter += 1;
          countEvent = 1;
        }
      } else if (mode === 'x1') {
        // Rising Edge A: jika B=1 -> CW (+1), jika B=0 -> CCW (-1)
        if (prevA === 0 && chA === 1) {
          const dir = (chB === 1) ? 1 : -1;
          counter += dir;
          countEvent = dir;
        }
      } else if (mode === 'x2') {
        // Rising & Falling Edge A
        if (prevA !== chA) {
          const dir = (chA === 1) ? (chB === 1 ? 1 : -1) : (chB === 0 ? 1 : -1);
          counter += dir;
          countEvent = dir;
        }
      } else if (mode === 'x4') {
        // Semua Edge A dan B
        if (prevA !== chA) {
          const dir = (chA === 1) ? (chB === 1 ? 1 : -1) : (chB === 0 ? 1 : -1);
          counter += dir;
          countEvent = dir;
        } else if (prevB !== chB) {
          const dir = (chB === 1) ? (chA === 0 ? 1 : -1) : (chA === 1 ? 1 : -1);
          counter += dir;
          countEvent = dir;
        }
      }

      prevA = chA;
      prevB = chB;

      waveHistory.push({ chA, chB, countEvent });
      if (waveHistory.length > maxHistory) waveHistory.shift();
    }
  }

  function updateMetrics() {
    const mode = modeSelect.value;
    const mult = mode === 'x4' ? 4 : (mode === 'x2' ? 2 : 1);
    const cpr = PPR * mult;
    const measuredDeg = (counter / cpr) * 360;
    const errDeg = Math.abs(totalAngle - measuredDeg);

    realPosVal.textContent = `${totalAngle.toFixed(1)}°`;
    realTurnSub.textContent = `Putaran Fisik: ${(totalAngle / 360).toFixed(2)}x`;
    counterVal.textContent = counter;
    measuredPosVal.textContent = `${measuredDeg.toFixed(1)}°`;

    if (mode === '1pulse' && rpm < 0) {
      dirVal.textContent = 'SALAH BACA (Tetap +)';
      dirVal.style.color = '#ef4444';
      phaseSub.textContent = 'Tidak ada Channel B!';
      errorSub.innerHTML = `<span class="warn-text">Melenceng: ${errDeg.toFixed(1)}°!</span>`;
    } else {
      if (rpm > 0) {
        dirVal.textContent = 'MAJU / CW (+)';
        dirVal.style.color = '#4ade80';
        phaseSub.textContent = mode === '1pulse' ? 'Hanya hitung frekuensi' : 'Ch A mendahului Ch B';
      } else if (rpm < 0) {
        dirVal.textContent = 'MUNDUR / CCW (-)';
        dirVal.style.color = '#fbbf24';
        phaseSub.textContent = 'Ch B mendahului Ch A';
      } else {
        dirVal.textContent = 'DIAM (0 RPM)';
        dirVal.style.color = '#94a3b8';
      }
      errorSub.textContent = `Selisih Resolusi: ±${(360 / cpr).toFixed(1)}°`;
    }
  }

  function drawMotor() {
    mCtx.clearRect(0, 0, motorCanvas.width, motorCanvas.height);
    const cx = motorCanvas.width / 2;
    const cy = 140;
    const r = 92;
    const mode = modeSelect.value;

    // Gambar Sensor A dan Sensor B di atas piringan
    mCtx.fillStyle = '#22c55e';
    mCtx.fillRect(cx - 4, cy - r - 12, 8, 16);
    mCtx.font = 'bold 11px sans-serif';
    mCtx.fillText('Sensor A', cx - 28, cy - r - 16);

    if (mode !== '1pulse') {
      // Sensor B digeser 90 derajat elektrik
      mCtx.fillStyle = '#f59e0b';
      mCtx.fillRect(cx + 18, cy - r - 9, 8, 16);
      mCtx.fillText('Sensor B (90°)', cx + 10, cy - r - 16);
    }

    mCtx.save();
    mCtx.translate(cx, cy);
    mCtx.rotate((totalAngle * Math.PI) / 180);

    // Piringan Encoder
    mCtx.beginPath();
    mCtx.arc(0, 0, r, 0, Math.PI * 2);
    mCtx.fillStyle = '#1e293b';
    mCtx.fill();
    mCtx.lineWidth = 3;
    mCtx.strokeStyle = '#475569';
    mCtx.stroke();

    // Celah PPR
    for (let i = 0; i < PPR; i++) {
      const a0 = (i * 2 * Math.PI) / PPR;
      const a1 = a0 + Math.PI / PPR;
      mCtx.beginPath();
      mCtx.arc(0, 0, r - 8, a0, a1);
      mCtx.arc(0, 0, r - 32, a1, a0, true);
      mCtx.closePath();
      mCtx.fillStyle = '#e2e8f0';
      mCtx.fill();
    }

    // Garis Penanda Poros (Jarum Penunjuk 0 Derajat)
    mCtx.strokeStyle = '#38bdf8';
    mCtx.lineWidth = 3;
    mCtx.beginPath();
    mCtx.moveTo(0, 0);
    mCtx.lineTo(0, -r + 35);
    mCtx.stroke();

    mCtx.beginPath();
    mCtx.arc(0, 0, 16, 0, Math.PI * 2);
    mCtx.fillStyle = '#64748b';
    mCtx.fill();
    mCtx.restore();
  }

  function drawWaveforms() {
    wCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
    const mode = modeSelect.value;

    // Label Jalur
    wCtx.font = 'bold 12px sans-serif';
    wCtx.fillStyle = '#22c55e';
    wCtx.fillText('Channel A', 12, 42);

    if (mode !== '1pulse') {
      wCtx.fillStyle = '#f59e0b';
      wCtx.fillText('Channel B', 12, 128);
    } else {
      wCtx.fillStyle = '#475569';
      wCtx.fillText('Channel B (TIDAK DIPAKAI)', 12, 128);
    }

    wCtx.fillStyle = '#ec4899';
    wCtx.fillText('Titik Hitung Counter (Edges)', 12, 205);

    const startX = 95;
    const stepX = 1.9;

    // Gambar Channel A
    wCtx.beginPath();
    wCtx.strokeStyle = '#22c55e';
    wCtx.lineWidth = 2.5;
    for (let i = 0; i < waveHistory.length; i++) {
      const x = startX + i * stepX;
      const y = 80 - waveHistory[i].chA * 38;
      if (i === 0) wCtx.moveTo(x, y);
      else {
        const prevY = 80 - waveHistory[i - 1].chA * 38;
        wCtx.lineTo(x, prevY);
        wCtx.lineTo(x, y);
      }
    }
    wCtx.stroke();

    // Gambar Channel B (jika bukan 1 pulse)
    if (mode !== '1pulse') {
      wCtx.beginPath();
      wCtx.strokeStyle = '#f59e0b';
      wCtx.lineWidth = 2.5;
      for (let i = 0; i < waveHistory.length; i++) {
        const x = startX + i * stepX;
        const y = 165 - waveHistory[i].chB * 38;
        if (i === 0) wCtx.moveTo(x, y);
        else {
          const prevY = 165 - waveHistory[i - 1].chB * 38;
          wCtx.lineTo(x, prevY);
          wCtx.lineTo(x, y);
        }
      }
      wCtx.stroke();
    }

    // Gambar Trigger Pulse / Counting Edges di baris bawah
    wCtx.strokeStyle = '#334155';
    wCtx.lineWidth = 1;
    wCtx.beginPath();
    wCtx.moveTo(startX, 235);
    wCtx.lineTo(waveCanvas.width - 10, 235);
    wCtx.stroke();

    for (let i = 0; i < waveHistory.length; i++) {
      const ev = waveHistory[i].countEvent;
      if (ev !== 0) {
        const x = startX + i * stepX;
        wCtx.strokeStyle = ev > 0 ? '#ec4899' : '#38bdf8';
        wCtx.lineWidth = 2;
        wCtx.beginPath();
        wCtx.moveTo(x, 235);
        wCtx.lineTo(x, 205);
        wCtx.stroke();

        wCtx.fillStyle = ev > 0 ? '#ec4899' : '#38bdf8';
        wCtx.beginPath();
        wCtx.arc(x, 205, 3, 0, Math.PI * 2);
        wCtx.fill();
      }
    }
  }

  function animate() {
    stepSimulation();
    updateMetrics();
    drawMotor();
    drawWaveforms();
    requestAnimationFrame(animate);
  }

  updateExplanation();
  animate();
</script>

</body>
</html>
