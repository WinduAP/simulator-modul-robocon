<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulator Diagram Blok Sistem Kontrol</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --card: #090d16;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --sig: #22c55e;
      --fb: #c084fc;
      --dist: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); display: flex; justify-content: center; }
    .container { max-width: 1000px; width: 100%; background: var(--panel); border-radius: 12px; padding: 20px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h2 { margin-top: 0; font-size: 1.3rem; color: var(--accent); }
    .sub { color: var(--muted); font-size: 0.9rem; margin: -6px 0 14px; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; background: #0f172a; padding: 14px; border-radius: 8px; margin-bottom: 14px; align-items: end; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    input[type="range"] { width: 100%; }
    button { padding: 9px 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #334155; }
    button.on { border-color: var(--warn); color: #fbbf24; background: rgba(245, 158, 11, 0.15); }
    .diagram-box { background: var(--card); border: 1px solid #334155; border-radius: 8px; padding: 8px; }
    svg { width: 100%; height: auto; display: block; }
    .blk rect { fill: #1e293b; stroke: #475569; stroke-width: 2; rx: 8; transition: 0.15s; }
    .blk text { fill: #e2e8f0; font-size: 14px; font-weight: 700; text-anchor: middle; pointer-events: none; }
    .blk .small { font-size: 11px; font-weight: 500; fill: #94a3b8; }
    .clk { cursor: pointer; }
    .clk:hover rect, .clk:hover circle { stroke: var(--accent); }
    .hl rect, .hl circle { stroke: var(--warn) !important; stroke-width: 3.5 !important; }
    .hl text.sig { fill: #fbbf24 !important; }
    .wire { fill: none; stroke-width: 2.5; stroke-dasharray: 8 6; }
    .wire.fwd { stroke: var(--sig); }
    .wire.fb { stroke: var(--fb); }
    .wire.dist { stroke: var(--dist); }
    .wire.cut { stroke: #475569; stroke-dasharray: 3 6; animation: none; }
    .wire { animation: flow 0.9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    text.sig { font-size: 13px; font-weight: 700; fill: #e2e8f0; }
    text.val { font-size: 12px; fill: #7dd3fc; font-family: Consolas, monospace; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
    .chip { padding: 6px 10px; border-radius: 999px; border: 1px solid #475569; background: #0f172a; color: #cbd5e1; font-size: 0.8rem; cursor: pointer; }
    .chip.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 700; }
    .grid2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
    .info-box { padding: 12px 14px; background: #0f172a; border-left: 4px solid var(--accent); border-radius: 6px; font-size: 0.9rem; line-height: 1.55; color: #e2e8f0; }
    .info-box h3 { margin: 0 0 4px; font-size: 1rem; color: var(--accent); }
    .info-box .sym { color: #fbbf24; font-family: Consolas, monospace; }
    .info-box p { margin: 6px 0; }
    .tag { font-weight: 700; color: #94a3b8; }
    .chart-box { background: var(--card); border: 1px solid #334155; border-radius: 8px; padding: 8px; }
    canvas { width: 100%; height: auto; display: block; }
    .legend { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .legend b { font-weight: 700; }
  </style>
</head>
<body>
<div class="container">
  <h2>Simulator Diagram Blok Sistem Kontrol (Kendali Kecepatan Roda)</h2>
  <p class="sub">Klik blok, garis sinyal, atau nama istilah untuk melihat pengertiannya. Angka pada diagram adalah nilai sinyal yang sedang berjalan.</p>

  <div class="controls">
    <div class="control-group">
      <label for="sp">Set-point r(t): <span id="spVal">1000</span> RPM</label>
      <input type="range" id="sp" min="0" max="1400" step="50" value="1000">
    </div>
    <div class="control-group">
      <label for="dist">Gangguan d(t) (beban/tanjakan): <span id="dVal">0</span> RPM</label>
      <input type="range" id="dist" min="0" max="500" step="25" value="0">
    </div>
    <div class="control-group">
      <label>Uji jalur umpan balik:</label>
      <button id="btnCut">Putuskan kabel sensor</button>
    </div>
    <div class="control-group">
      <label>Tampilan nama blok:</label>
      <button id="btnAnalogy">Mode analogi pancuran</button>
    </div>
  </div>

  <div class="diagram-box">
    <svg viewBox="0 0 900 300" id="svg">
      <defs>
        <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
        <marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/></marker>
        <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
      </defs>

      <!-- kabel -->
      <path class="wire fwd" d="M80,120 L130,120" marker-end="url(#arG)"/>
      <path class="wire fwd" d="M168,120 L218,120" marker-end="url(#arG)"/>
      <path class="wire fwd" d="M338,120 L398,120" marker-end="url(#arG)"/>
      <path class="wire fwd" d="M518,120 L578,120" marker-end="url(#arG)"/>
      <path class="wire fwd" d="M698,120 L860,120" marker-end="url(#arG)"/>
      <path class="wire dist" d="M638,30 L638,92" marker-end="url(#arR)"/>
      <path class="wire fb" id="fb1" d="M780,120 L780,250 L560,250"/>
      <path class="wire fb" id="fb2" d="M440,250 L149,250 L149,141" marker-end="url(#arP)"/>

      <!-- sinyal (dapat diklik) -->
      <g class="clk" data-key="setpoint"><text class="sig" x="16" y="112">r(t)</text><text class="val" id="vR" x="10" y="142">1000</text></g>
      <g class="clk" data-key="error"><text class="sig" x="176" y="110">e(t)</text><text class="val" id="vE" x="172" y="145">0</text></g>
      <g class="clk" data-key="control"><text class="sig" x="350" y="110">u(t)</text><text class="val" id="vU" x="346" y="145">0%</text></g>
      <g class="clk" data-key="disturbance"><text class="sig" x="650" y="30">d(t)</text><text class="val" id="vD" x="650" y="48">0</text></g>
      <g class="clk" data-key="output"><text class="sig" x="812" y="110">c(t)</text><text class="val" id="vC" x="806" y="145">0</text></g>
      <g class="clk" data-key="feedback"><text class="sig" x="290" y="242">b(t)</text><text class="val" id="vB" x="290" y="275">0</text></g>

      <!-- blok -->
      <g class="clk" data-key="summing"><circle cx="149" cy="120" r="19" fill="#1e293b" stroke="#475569" stroke-width="2"/>
        <text x="149" y="126" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle" pointer-events="none">Σ</text>
        <text x="128" y="106" fill="#22c55e" font-size="14" font-weight="700" pointer-events="none">+</text>
        <text x="156" y="158" fill="#c084fc" font-size="16" font-weight="700" pointer-events="none">−</text></g>
      <g class="blk clk" data-key="controller"><rect x="218" y="92" width="120" height="56" rx="8"/><text x="278" y="117" id="tCtrl">Controller</text><text class="small" x="278" y="135" id="sCtrl">PI di STM32</text></g>
      <g class="blk clk" data-key="actuator"><rect x="398" y="92" width="120" height="56" rx="8"/><text x="458" y="117" id="tAct">Actuator</text><text class="small" x="458" y="135" id="sAct">Motor driver</text></g>
      <g class="blk clk" data-key="plant"><rect x="578" y="92" width="120" height="56" rx="8"/><text x="638" y="117" id="tPlant">Plant G(s)</text><text class="small" x="638" y="135" id="sPlant">Motor + roda</text></g>
      <g class="clk" data-key="branch"><circle cx="780" cy="120" r="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/></g>
      <g class="blk clk" data-key="sensor"><rect x="440" y="222" width="120" height="56" rx="8"/><text x="500" y="247" id="tSens">Sensor H(s)</text><text class="small" x="500" y="265" id="sSens">Encoder</text></g>
      <text id="cutMark" x="660" y="242" fill="#ef4444" font-size="22" font-weight="800" visibility="hidden">✂</text>
    </svg>
  </div>

  <div class="chips" id="chips"></div>

  <div class="grid2">
    <div class="info-box" id="info"></div>
    <div class="chart-box">
      <canvas id="chart" width="520" height="230"></canvas>
      <div class="legend"><b style="color:#38bdf8">— r(t) set-point</b> &nbsp; <b style="color:#22c55e">— c(t) keluaran nyata</b> &nbsp; <b style="color:#c084fc">— b(t) umpan balik</b> &nbsp; <b style="color:#ef4444">— d(t) gangguan</b></div>
    </div>
  </div>
</div>

<script>
  const TERMS = {
    system: { name: 'System', sym: '–', def: 'Kumpulan komponen yang bekerja bersama untuk mencapai tujuan tertentu. Pada diagram ini, seluruh rangkaian dari set-point sampai sensor adalah satu sistem kendali kecepatan roda.', robot: 'Seluruh kendali kecepatan satu roda: program, driver, motor, dan encoder.', analogy: 'Seluruh kegiatan mandi dengan air hangat: orang, keran, pipa, dan air.', els: ['controller', 'actuator', 'plant', 'sensor', 'summing', 'branch'] },
    process: { name: 'Process', sym: '–', def: 'Rangkaian operasi berkelanjutan yang dikendalikan untuk mencapai hasil akhir.', robot: 'Proses roda berakselerasi dan mempertahankan putarannya.', analogy: 'Proses mengalirnya air dan berubahnya suhu air.', els: ['plant'] },
    plant: { name: 'Plant', sym: 'G(s)', def: 'Objek fisik yang dikendalikan keadaannya. Keluarannya adalah besaran yang ingin diatur.', robot: 'Motor DC beserta gearbox dan roda robot.', analogy: 'Air dan pipa pancuran.', els: ['plant'] },
    setpoint: { name: 'Set-point / reference input', sym: 'r(t), R(s)', def: 'Nilai target yang diperintahkan ke sistem.', robot: 'Kecepatan roda yang diminta, misalnya 1000 RPM. Geser slider set-point untuk mengubahnya.', analogy: 'Suhu air yang diinginkan.', els: ['setpoint'] },
    output: { name: 'Controlled variable / process variable', sym: 'c(t), C(s), PV', def: 'Besaran nyata yang dikendalikan; keluaran utama plant.', robot: 'Kecepatan roda yang sebenarnya.', analogy: 'Suhu air yang benar-benar keluar dari pancuran.', els: ['output'] },
    sensor: { name: 'Sensor / measuring element', sym: 'H(s)', def: 'Alat ukur yang membaca c(t) dan mengubahnya menjadi sinyal yang dapat dibandingkan dengan set-point.', robot: 'Encoder yang dibaca timer STM32 lalu diubah menjadi RPM.', analogy: 'Kulit tangan yang merasakan air.', els: ['sensor'] },
    feedback: { name: 'Feedback signal', sym: 'b(t), B(s)', def: 'Sinyal hasil pembacaan sensor yang dikirim kembali ke titik pembanding. Coba tombol "Putuskan kabel sensor": b(t) menjadi 0, controller mengira roda diam dan memberi PWM penuh.', robot: 'Nilai RPM hasil hitungan encoder.', analogy: 'Rasa hangat/dingin yang sampai ke otak.', els: ['feedback'] },
    summing: { name: 'Comparator / summing point', sym: 'Σ dengan tanda + dan −', def: 'Titik yang mengurangkan sinyal acuan dengan sinyal umpan balik: e(t) = r(t) − b(t).', robot: 'Baris program error = target − rpm_terukur.', analogy: 'Otak membandingkan "seharusnya" dengan "yang terasa".', els: ['summing'] },
    error: { name: 'Actuating error signal', sym: 'e(t), E(s)', def: 'Selisih acuan dan umpan balik. Pada sensor ideal e(t) = r(t) − c(t). Tujuan sistem kendali adalah membuat nilai ini mendekati nol.', robot: 'Kekurangan atau kelebihan RPM saat ini.', analogy: '"Masih terlalu dingin" atau "kepanasan".', els: ['error'] },
    controller: { name: 'Controller', sym: 'Gc(s)', def: 'Bagian yang membaca error dan menghitung besar koreksi. Di simulator ini memakai PI dengan anti-windup.', robot: 'Fungsi PID di STM32.', analogy: 'Otak yang memutuskan seberapa jauh keran harus diputar.', els: ['controller'] },
    control: { name: 'Manipulated variable / control signal', sym: 'u(t), U(s)', def: 'Sinyal keluaran controller yang diberikan ke aktuator. Nilainya dibatasi 0–100%.', robot: 'Duty cycle PWM ke motor driver.', analogy: 'Perintah otak ke tangan: "putar keran sedikit lagi".', els: ['control'] },
    actuator: { name: 'Actuator', sym: '–', def: 'Perangkat berdaya yang menjalankan perintah u(t) ke plant.', robot: 'Motor driver (H-bridge) yang menyalurkan daya baterai ke motor.', analogy: 'Tangan yang memutar keran.', els: ['actuator'] },
    disturbance: { name: 'Disturbance', sym: 'd(t), D(s)', def: 'Gangguan yang menggeser keluaran dari set-point. Geser slider gangguan: tanpa umpan balik kecepatan turun permanen, dengan umpan balik controller menaikkan PWM sampai kecepatan kembali.', robot: 'Tanjakan, beban tambahan, atau gesekan lantai.', analogy: 'Orang lain menyalakan keran dapur sehingga suhu pancuran berubah.', els: ['disturbance'] },
    block: { name: 'Functional block', sym: 'G(s), H(s)', def: 'Kotak pada diagram blok yang menyatakan hubungan keluaran terhadap masukan suatu komponen. Sinyal masuk dari kiri, dikalikan fungsi blok, lalu keluar ke kanan.', robot: 'Setiap kotak: controller, driver, motor, encoder.', analogy: 'Setiap "pelaku" dalam kegiatan mandi.', els: ['controller', 'actuator', 'plant', 'sensor'] },
    branch: { name: 'Branch point / take-off point', sym: '•', def: 'Titik pencabangan sinyal ke beberapa tujuan tanpa mengubah nilainya. Di sini c(t) dicabang ke keluaran dan ke sensor.', robot: 'Kecepatan roda yang sama dirasakan robot dan dibaca encoder.', analogy: 'Air yang sama mengenai badan dan dirasakan tangan.', els: ['branch'] }
  };
  const ORDER = ['system', 'process', 'plant', 'setpoint', 'output', 'sensor', 'feedback', 'summing', 'error', 'controller', 'control', 'actuator', 'disturbance', 'block', 'branch'];

  const NAMES = {
    normal: { tCtrl: 'Controller', sCtrl: 'PI di STM32', tAct: 'Actuator', sAct: 'Motor driver', tPlant: 'Plant G(s)', sPlant: 'Motor + roda', tSens: 'Sensor H(s)', sSens: 'Encoder' },
    analogy: { tCtrl: 'Otak', sCtrl: 'memutuskan koreksi', tAct: 'Tangan', sAct: 'memutar keran', tPlant: 'Air & pipa', sPlant: 'suhu berubah', tSens: 'Kulit', sSens: 'merasakan suhu' }
  };

  let current = 'plant';
  let analogyMode = false;
  let cut = false;

  const chips = document.getElementById('chips');
  ORDER.forEach(k => {
    const c = document.createElement('span');
    c.className = 'chip'; c.textContent = TERMS[k].name; c.dataset.key = k;
    c.addEventListener('click', () => select(k));
    chips.appendChild(c);
  });
  document.querySelectorAll('svg .clk').forEach(g => g.addEventListener('click', () => select(g.dataset.key)));

  function select(k) {
    current = k;
    const t = TERMS[k];
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.key === k));
    document.querySelectorAll('svg .clk').forEach(g => g.classList.toggle('hl', t.els.includes(g.dataset.key)));
    document.getElementById('info').innerHTML =
      `<h3>${t.name}</h3><div class="sym">Simbol: ${t.sym}</div>` +
      `<p>${t.def}</p><p><span class="tag">Pada robot:</span> ${t.robot}</p>` +
      `<p><span class="tag">Analogi pancuran:</span> ${t.analogy}</p>`;
  }

  document.getElementById('btnAnalogy').addEventListener('click', (e) => {
    analogyMode = !analogyMode;
    e.target.classList.toggle('on', analogyMode);
    const n = analogyMode ? NAMES.analogy : NAMES.normal;
    for (const id in n) document.getElementById(id).textContent = n[id];
  });
  document.getElementById('btnCut').addEventListener('click', (e) => {
    cut = !cut;
    e.target.classList.toggle('on', cut);
    e.target.textContent = cut ? 'Sambungkan kembali sensor' : 'Putuskan kabel sensor';
    document.getElementById('fb2').setAttribute('class', cut ? 'wire cut' : 'wire fb');
    document.getElementById('cutMark').setAttribute('visibility', cut ? 'visible' : 'hidden');
  });

  const sp = document.getElementById('sp'), ds = document.getElementById('dist');
  sp.addEventListener('input', () => document.getElementById('spVal').textContent = sp.value);
  ds.addEventListener('input', () => document.getElementById('dVal').textContent = ds.value);

  // ---- model: roda (orde satu) + PI ----------------------------------------
  const TAU = 0.5, KPLANT = 15;       // 15 RPM per % PWM, konstanta waktu 0,5 s
  const KP = 0.08, KI = 0.25;          // %/RPM dan %/(RPM·s)
  const DT = 1 / 60;
  let c = 0, integ = 0, t = 0, u = 0, e = 0, b = 0;
  const hist = [];
  const HMAX = 600;

  function step() {
    const r = +sp.value, d = +ds.value;
    b = cut ? 0 : c;
    e = r - b;
    integ += KI * e * DT;
    integ = Math.max(0, Math.min(100, integ));
    u = Math.max(0, Math.min(100, KP * e + integ));
    c += (KPLANT * u - c - d) / TAU * DT;
    if (c < 0) c = 0;
    t += DT;
    hist.push({ r, c, b, d });
    if (hist.length > HMAX) hist.shift();
  }

  function updateLabels() {
    document.getElementById('vR').textContent = `${(+sp.value).toFixed(0)} RPM`;
    document.getElementById('vE').textContent = e.toFixed(0);
    document.getElementById('vU').textContent = `${u.toFixed(0)}%`;
    document.getElementById('vD').textContent = `${(+ds.value).toFixed(0)} RPM`;
    document.getElementById('vC').textContent = `${c.toFixed(0)} RPM`;
    document.getElementById('vB').textContent = cut ? '0 (putus)' : `${b.toFixed(0)} RPM`;
  }

  const cv = document.getElementById('chart'), ctx = cv.getContext('2d');
  function drawChart() {
    const w = cv.width, h = cv.height, x0 = 44, y0 = 12, y1 = h - 22;
    const maxV = 1600;
    const Y = v => y1 - (Math.max(0, Math.min(maxV, v)) / maxV) * (y1 - y0);
    ctx.clearRect(0, 0, w, h);
    ctx.font = '11px sans-serif'; ctx.fillStyle = '#64748b';
    for (let v = 0; v <= maxV; v += 400) {
      ctx.strokeStyle = '#1e293b'; ctx.beginPath(); ctx.moveTo(x0, Y(v)); ctx.lineTo(w, Y(v)); ctx.stroke();
      ctx.fillText(v, 4, Y(v) + 4);
    }
    ctx.fillText('10 detik terakhir', w - 100, h - 6);
    const dx = (w - x0) / HMAX;
    const line = (key, col, wd) => {
      ctx.beginPath(); ctx.strokeStyle = col; ctx.lineWidth = wd;
      hist.forEach((p, i) => { const x = x0 + i * dx, y = Y(p[key]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke();
    };
    line('d', '#ef4444', 1.5); line('r', '#38bdf8', 2); line('b', '#c084fc', 1.5); line('c', '#22c55e', 2.5);
  }

  function animate() {
    step(); updateLabels(); drawChart();
    requestAnimationFrame(animate);
  }
  select('plant');
  animate();
</script>
</body>
</html>
